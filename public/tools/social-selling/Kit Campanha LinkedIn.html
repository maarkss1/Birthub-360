<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kit da Campanha LinkedIn — Birth Hub 360</title>
    <style>
      :root {
        --orange: #ff5618;
        --orange-deep: #ff6b10;
        --orange-light: #ff8008;
        --yellow: #ffc500;
        --graphite: #333333;
        --white: #ffffff;
        --offwhite: #fbfaf9;
        --border: #efe3db;
        --m: #6d6d6d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--offwhite);
        color: var(--graphite);
        font-family: Montserrat, Arial, sans-serif;
        line-height: 1.55;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 48px 24px 70px;
      }
      header {
        text-align: center;
        margin-bottom: 40px;
      }
      .eyebrow {
        color: var(--orange);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1.4px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(26px, 4vw, 38px);
        font-weight: 900;
        letter-spacing: -0.6px;
        margin: 0 0 12px;
      }
      header p {
        color: var(--m);
        font-size: 15px;
        max-width: 600px;
        margin: 0 auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 26px 24px;
        cursor: pointer;
        transition: 0.18s;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
        display: flex;
        flex-direction: column;
      }
      .card:hover {
        border-color: var(--orange);
        transform: translateY(-3px);
        box-shadow: 0 16px 32px rgba(255, 86, 24, 0.12);
      }
      .card .tag {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 5px 10px;
        border-radius: 99px;
        margin-bottom: 14px;
        width: fit-content;
      }
      .tag.t1 {
        background: #e8eef7;
        color: #2a4d8f;
      }
      .tag.t2 {
        background: #f3e8f7;
        color: #7c2a8f;
      }
      .tag.t3 {
        background: var(--opt-sel-bg, #fff3eb);
        color: var(--orange);
      }
      .card .ic {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--orange);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
      }
      .card .ic svg {
        width: 19px;
        height: 19px;
        stroke: #fff;
        fill: none;
        stroke-width: 2;
      }
      .card h3 {
        font-size: 17px;
        margin: 0 0 8px;
        letter-spacing: -0.2px;
      }
      .card p {
        font-size: 13px;
        color: var(--m);
        margin: 0 0 18px;
        flex: 1;
      }
      .card .open {
        font-size: 12.5px;
        font-weight: 800;
        color: var(--orange);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .card .open svg {
        width: 14px;
        height: 14px;
        stroke: var(--orange);
        fill: none;
        stroke-width: 2.4;
      }
      /* VIEWER */
      #viewer {
        display: none;
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 100;
        flex-direction: column;
      }
      .viewer-top {
        background: var(--graphite);
        color: #fff;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 0 0 auto;
      }
      .viewer-top button {
        background: var(--orange);
        border: 0;
        color: #fff;
        font-weight: 800;
        font-size: 13px;
        padding: 9px 16px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .viewer-top button svg {
        width: 15px;
        height: 15px;
        stroke: #fff;
        fill: none;
        stroke-width: 2.4;
      }
      .viewer-top span {
        font-size: 13.5px;
        font-weight: 700;
        color: #ddd;
      }
      #viewerFrame {
        flex: 1;
        border: 0;
        width: 100%;
      }
      .loadmsg {
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 99;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      .loadmsg .spin {
        width: 34px;
        height: 34px;
        border: 3px solid #f1e9e3;
        border-top-color: var(--orange);
        border-radius: 50%;
        animation: sp 0.7s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .loadmsg span {
        font-size: 13px;
        color: var(--m);
        font-weight: 700;
      }
      footer {
        text-align: center;
        margin-top: 40px;
        font-size: 12px;
        color: #aaa;
      }
      @media (max-width: 640px) {
        .wrap {
          padding: 32px 16px 50px;
        }
      }
    </style>
  </head>

      function render() {
        document.getElementById('grid').innerHTML = ITEMS.map(
          (it) => `
    <div class="card" data-id="${it.id}">
      <span class="tag ${it.tag}">${it.tagLabel}</span>
      <div class="ic"><svg viewBox="0 0 24 24"><path d="${ICONS[it.icon]}"/></svg></div>
      <h3>${it.title}</h3>
      <p>${it.desc}</p>
      <span class="open">Abrir conteúdo <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
    </div>`,
        ).join('');
        document.querySelectorAll('.card').forEach((el) => {
          el.onclick = () => openItem(el.dataset.id);
        });
      }

      function openItem(id) {
        const it = ITEMS.find((x) => x.id === id);
        document.getElementById('loadmsg').style.display = 'flex';
        setTimeout(() => {
          const html = b64DecodeUnicode(it.b64);
          document.getElementById('viewerTitle').textContent = it.title;
          document.getElementById('viewerFrame').srcdoc = html;
          document.getElementById('viewer').style.display = 'flex';
          document.getElementById('loadmsg').style.display = 'none';
        }, 30);
      }

      document.getElementById('closeViewer').onclick = () => {
        document.getElementById('viewer').style.display = 'none';
        document.getElementById('viewerFrame').srcdoc = '';
      };

      render();
    </script>
  </body>
</html>
