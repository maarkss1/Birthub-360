# Stack de produção self-hosted no Oracle Cloud Infrastructure (OCI).
#
# Stack mínimo do MVP (sempre sobe com `docker compose up -d`, sem flags extras):
#   app (monólito Node/Express + frontend Vite) + postgres + caddy (reverse proxy/TLS).
#
# `redis` e `worker` são OPT-IN via Compose profile `queues` — decisão de produto registrada em
# `render.yaml` (ENABLE_QUEUES=false no serviço web) e em `docs/deploy/oracle-cloud.md`: nenhuma
# jornada essencial do MVP (auth, CRM, Prospecção, dashboard) depende de fila/Redis — ver
# `src/lib/queue/redis.ts` (REDIS_URL ausente => `queuesEnabled=false`, app sobe normalmente).
# Para habilitar filas/worker mais tarde, quando alguma jornada realmente depender disso:
#   ENABLE_QUEUES=true no .env.production + `docker compose -f docker-compose.oci.yml --profile queues up -d`
#
# Nunca suba `redis`/`worker` ao lado de outro processo que também consuma as mesmas filas
# BullMQ — duplicar consumers reprocessa jobs (ver ADR-004 e docs/ADR/ADR-003, seção A).
#
# DEVOPS-003 (Onda 2, docs/audits/repository-debt-audit/agents/DEVOPS.md): Prometheus para esta
# instância agora é OPT-IN via profile `observability` (mesmo padrão de opt-in do profile
# `queues`), não mais "fora do MVP" — a barreira técnica antes documentada aqui (ACH-10-01: "o
# scrape_config nativo do Prometheus não sabe enviar o header customizado
# x-platform-operator-token") estava incompleta: o Prometheus tem um campo nativo `params` para
# parâmetros de URL, e `requirePlatformOperator` já aceita o token via querystring
# (?operator_token=...) — mesma trava, caminho de autenticação diferente, zero mudança de código de
# segurança. Ver `docs/deploy/oracle-cloud.md` seção 11 (revisada nesta onda) para o detalhamento e
# `infrastructure/observability/RUNBOOK.md` para como operar com essa métrica agora disponível.
# Para habilitar: `ENABLE_OBSERVABILITY=true` em `.env.production` antes de rodar
# `scripts/deploy-oci.sh` (gera PLATFORM_OPERATOR_TOKEN se ainda não existir, liga EXPOSE_METRICS e
# sobe o profile `observability` — ver o próprio script). Sem essa variável no arquivo, o
# comportamento é idêntico a antes desta correção (nenhum Prometheus sobe, nenhum segredo novo é
# gerado).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: birthhub_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://prospector_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@postgres:5432/prospectordb
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      # Opcionais por padrão (stack mínimo do MVP): só têm efeito quando o profile `queues` está
      # ativo E o operador define os dois no .env.production (ver cabeçalho deste arquivo e
      # scripts/deploy-oci.sh). Sem eles, `queuesEnabled=false` e a aplicação sobe normalmente.
      - ENABLE_QUEUES=${ENABLE_QUEUES:-false}
      - REDIS_URL=${REDIS_URL:-}
      - COMMIT_SHA=${COMMIT_SHA:-unknown}
      - BUILD_VERSION=${BUILD_VERSION:-1.0.0}
      - DEPLOY_TIMESTAMP=${DEPLOY_TIMESTAMP:-unknown}
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3000/health/live'', (r) => {process.exit(r.statusCode === 200 ? 0 : 1);}).on(''error'', () => process.exit(1));"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # Worker dedicado (filas BullMQ + cron de negócio) — só sobe com `--profile queues`. Nunca ativar
  # sem `ENABLE_QUEUES=true` também no serviço `app` estar deliberadamente mantido em modo produtor
  # apenas: ver render.yaml (mesmo padrão, mesmo aviso de duplicação de consumo).
  worker:
    profiles: ['queues']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: birthhub_worker
    restart: unless-stopped
    command: ['sh', '-c', 'npx prisma migrate deploy && exec npm run start:worker']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - ENABLE_QUEUES=true
      - DATABASE_URL=postgresql://prospector_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@postgres:5432/prospectordb
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      # Sem valor obrigatório (:?) aqui de propósito: profiles do Compose não isentam serviços da
      # interpolação de variáveis, então um `:?` faria `docker compose config`/`up` falhar mesmo
      # quando o profile `queues` está inativo. scripts/deploy-oci.sh valida REDIS_PASSWORD
      # explicitamente antes de subir este profile.
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - COMMIT_SHA=${COMMIT_SHA:-unknown}
      - BUILD_VERSION=${BUILD_VERSION:-1.0.0}
      - DEPLOY_TIMESTAMP=${DEPLOY_TIMESTAMP:-unknown}
    security_opt:
      - no-new-privileges:true

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: birthhub360/postgres-intelligence:16
    container_name: birthhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: ${BOOTSTRAP_DB_PASSWORD:?BOOTSTRAP_DB_PASSWORD must be set}
      POSTGRES_DB: prospectordb
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    volumes:
      - oci_pgdata:/var/lib/postgresql/data
      - ./scripts/db/create-app-role.sql:/docker-entrypoint-initdb.d/create-app-role.sql.tpl:ro
      - ./scripts/db/docker-init.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
      - ./scripts/db/02-enable-extensions.sql:/docker-entrypoint-initdb.d/02-enable-extensions.sql:ro
      - ./scripts/db/03-create-langfuse-db.sql:/docker-entrypoint-initdb.d/03-create-langfuse-db.sql:ro
    # Publicado em todas as interfaces DE PROPÓSITO (decisão do dono do produto, 2026-09-08): este
    # é o ÚNICO Postgres da aplicação — as máquinas de desenvolvimento apontam DATABASE_URL direto
    # para <IP público da instância>:5432, sem Postgres local/Docker. Proteções que acompanham
    # isso (nenhuma é opcional):
    #   - TLS no fio: `ssl=on` abaixo com certificado autoassinado gerado no build da imagem
    #     (docker/postgres/Dockerfile); cliente usa `?sslmode=require&uselibpqcompat=true`.
    #   - Security List/NSG da VCN libera 5432 SÓ para os IPs de origem dos desenvolvedores
    #     (nunca 0.0.0.0/0) — ver docs/deploy/oracle-cloud.md seções 2.1 e 4.2.
    #   - Papel de aplicação NOSUPERUSER (prospector_app) com senha forte gerada pelo deploy.
    ports:
      - '5432:5432'
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prospector -d prospectordb']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Cache/fila — só sobe com `--profile queues` (ver cabeçalho deste arquivo).
  redis:
    profiles: ['queues']
    image: redis:7-alpine
    container_name: birthhub_redis
    restart: unless-stopped
    # Sem `:?` de propósito — ver comentário no serviço `worker` acima sobre interpolação e
    # profiles. scripts/deploy-oci.sh recusa subir este profile sem REDIS_PASSWORD definido.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-}', '--appendonly', 'yes']
    volumes:
      - oci_redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Métricas/health centralizados da instância real — só sobe com `--profile observability`
  # (DEVOPS-003, Onda 2). Scrape roda inteiramente na rede interna do Compose (alvo `app:3000`,
  # nunca via domínio público/Caddy). Config real é gerada por scripts/deploy-oci.sh a partir de
  # infrastructure/observability/prometheus.oci.yml.tpl (nunca versionada com o token real).
  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v3.5.0
    container_name: birthhub_prometheus
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d', '--storage.tsdb.retention.size=1GB']
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./infrastructure/observability/prometheus.oci.generated.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - oci_prometheus_data:/prometheus
    # Loopback de propósito (mesmo padrão de app/redis acima) — um operador acessa via túnel SSH
    # (`ssh -L 9090:127.0.0.1:9090 ...`) até existir uma rota autenticada via Caddy, fora do escopo
    # desta correção.
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: birthhub_caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN:-:80}
      - ACME_EMAIL=${ACME_EMAIL:-admin@atlasgr.com.br}
    volumes:
      - ./Caddyfile.oci:/etc/caddy/Caddyfile:ro
      - oci_caddy_data:/data
      - oci_caddy_config:/config
    security_opt:
      - no-new-privileges:true

  # Busca de Company/Lead (src/lib/search/index.ts) — NÃO é opt-in como queues/observability
  # acima: resolveMeiliApiKey() lança exceção e recusa subir em NODE_ENV=production sem
  # MEILI_MASTER_KEY (fail-closed de propósito, mesma família de trava de
  # BETTER_AUTH_SECRET/CREDENTIALS_ENCRYPTION_KEY — uma master key hardcoded permitiria consulta
  # cross-tenant a qualquer Meilisearch acessível na rede). Este serviço faltava neste compose
  # (só existia no docker-compose.yml de dev) — sem ele o container `app` entra em crash loop
  # logo na inicialização. scripts/deploy-oci.sh gera MEILI_MASTER_KEY com o mesmo
  # `ensure_hex_secret` usado para os outros segredos obrigatórios.
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: birthhub_meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      - MEILI_ENV=production
    volumes:
      - oci_meilidata:/meili_data
    healthcheck:
      # 127.0.0.1, não "localhost" — mesmo motivo documentado no compose de dev
      # (docker-compose.yml): "localhost" resolve pra ::1 dentro do container e o wget não cai
      # pra IPv4, fazendo o healthcheck falhar sempre mesmo com o Meilisearch respondendo 200.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  oci_pgdata:
  oci_redisdata:
  oci_caddy_data:
  oci_caddy_config:
  oci_prometheus_data:
  oci_meilidata:
