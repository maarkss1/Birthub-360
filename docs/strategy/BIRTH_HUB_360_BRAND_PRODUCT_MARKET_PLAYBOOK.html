<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birth Hub 360 — O Livro da Marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS — marca real (src/config/brand.ts) ============================= */
:root{
  --gold:#D4AF37;
  --gold-soft:#EBD689;
  --gold-deep:#9C7A22;
  --iris:#5B21B6;
  --iris-soft:#8B5CF6;
  --orbit:#0065D2;
  --orbit-soft:#4FA3FF;
  --obsidian:#0B132B;
  --midnight:#070B1A;
  --snow:#F8FAFC;

  --bg:var(--obsidian);
  --panel:#111a3a;
  --panel-2:#152047;
  --card:#0f1733cc;
  --line:rgba(248,250,252,.14);
  --line-soft:rgba(248,250,252,.08);
  --ink:var(--snow);
  --ink-dim:rgba(248,250,252,.78);
  --ink-faint:rgba(248,250,252,.58);
  --ink-on-gold:#241C08;

  --font-display:'Bodoni Moda',Georgia,'Times New Roman',serif;
  --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;

  --st-confirmed:#4ADE9C;
  --st-hypothesis:#9CB0FF;
  --st-recommendation:#E8C468;
  --st-validate:#F5A742;
  --st-open:#FB7185;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body.continuous{overflow:auto}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);font-weight:600}
p{margin:0 0 1em}
a{color:var(--gold-soft)}
::selection{background:var(--gold);color:var(--ink-on-gold)}
img,svg{max-width:100%}
button{font-family:inherit}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }
[inert]{display:none}

/* ============================= EMBLEMA — halo autorizado ouro→íris→azul ============================= */
.emblem{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.emblem .ring{position:absolute;border-radius:50%}
.emblem .ring-outer{
  inset:0;padding:2px;
  background:conic-gradient(from 200deg,var(--gold) 0%,var(--gold-soft) 16%,var(--iris-soft) 38%,var(--iris) 52%,var(--orbit) 70%,var(--orbit-soft) 85%,var(--gold) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.emblem .ring-mid{inset:14%;border:1px solid rgba(248,250,252,.22)}
.emblem .core{
  position:absolute;inset:20%;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(139,92,246,.35),rgba(11,19,43,.96) 62%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.emblem .core .beam{
  position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(212,175,55,.16) 50%,transparent 60%);
  clip-path:circle(50%);
}
.emblem .mono{
  font-family:var(--font-display);font-style:italic;font-weight:700;color:var(--gold-soft);
  position:relative;z-index:1;
}
.emblem.spin .ring-outer{animation:emblemspin 40s linear infinite}
@keyframes emblemspin{to{transform:rotate(360deg)}}

/* ============================= BOOK STAGE ============================= */
.book-stage{position:fixed;inset:0;perspective:2400px}
body.continuous .book-stage{position:static;perspective:none;height:auto}

.page{
  position:absolute;inset:0;display:flex;flex-direction:column;
  transform:translateX(0) rotateY(0deg);transform-origin:left center;opacity:1;
  transition:transform .68s cubic-bezier(.2,.8,.2,1),opacity .5s ease;
  background:var(--bg);
}
.page[hidden]{display:flex !important}
.page.dir-next{transform:translateX(38%) rotateY(-14deg) scale(.96);opacity:0}
.page.dir-prev{transform:translateX(-38%) rotateY(14deg) scale(.96);opacity:0}
.page.active{transform:translateX(0) rotateY(0deg) scale(1);opacity:1;z-index:2}
@media (prefers-reduced-motion:reduce){
  .page{transition:opacity .25s ease}
  .page.dir-next,.page.dir-prev{transform:none}
}

body.continuous .page{
  position:static;transform:none !important;opacity:1 !important;min-height:100vh;
  border-bottom:1px solid var(--line-soft);
}

.page-inner{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;padding:0}
.page-content{max-width:900px;margin:0 auto;padding:64px 40px 90px;width:100%}
@media (max-width:720px){.page-content{padding:40px 22px 80px}}

/* chapter chrome (não é eyebrow — é a etiqueta do próprio livro, parte da paginação) */
.chapter-tag{
  font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--gold-soft);
  margin-bottom:6px;
}
.chapter-title{font-size:clamp(28px,4.4vw,46px);line-height:1.08;max-width:760px;font-weight:600}
.chapter-lede{font-size:18px;color:var(--ink-dim);max-width:640px;margin-top:18px;font-weight:400}
.chapter-lede em{color:var(--gold-soft);font-style:italic}

.prose{max-width:66ch;font-size:17px;color:var(--ink-dim);line-height:1.75}
.prose p{margin:0 0 1.3em}
.prose strong{color:var(--ink);font-weight:600}
.prose .lead{font-size:19px;color:var(--ink)}
.dropcap:first-letter{
  font-family:var(--font-display);font-size:64px;line-height:.75;float:left;padding:6px 10px 0 0;
  color:var(--gold-soft);font-weight:700;
}

/* ============================= CHROME: nav, toc, counter ============================= */
.book-chrome{position:fixed;inset:0;pointer-events:none;z-index:40}
.book-chrome > *{pointer-events:auto}
body.continuous .book-chrome{display:none}

.topline{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;z-index:41}
.topline::before{content:"";position:absolute;inset:0 0 -46px;background:linear-gradient(to bottom,var(--bg) 40%,transparent);z-index:-1;pointer-events:none}
.homebtn{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;color:var(--ink)}
.homebtn .emblem{width:30px;height:30px}
.homebtn .emblem .mono{font-size:14px}
.homebtn span{font-family:var(--font-display);font-size:13px;letter-spacing:.03em;color:var(--ink-dim);white-space:nowrap}
@media (max-width:560px){
  .homebtn span{display:none}
  .chrome-btn span{display:none}
  .chrome-btn{padding:9px}
  .topline{padding:14px 16px}
  .navline{gap:14px}
}
.chrome-actions{display:flex;gap:10px;align-items:center}
.chrome-btn{
  background:rgba(248,250,252,.06);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:100px;padding:8px 16px;font-size:12.5px;cursor:pointer;font-family:var(--font-body);
  display:flex;align-items:center;gap:7px;backdrop-filter:blur(8px);
}
.chrome-btn:hover{color:var(--ink);border-color:var(--gold-soft)}
.chrome-btn svg{width:14px;height:14px}

.navline{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px;padding:20px 28px 26px}
.navline::before{content:"";position:absolute;inset:-56px 0 0;background:linear-gradient(to top,var(--bg) 46%,transparent);z-index:-1;pointer-events:none}
.navbtn{
  width:46px;height:46px;border-radius:50%;background:rgba(248,250,252,.06);border:1px solid var(--line);
  color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);
}
.navbtn:hover{border-color:var(--gold-soft);color:var(--gold-soft)}
.navbtn:disabled{opacity:.25;cursor:default;border-color:var(--line);color:var(--ink-faint)}
.navbtn svg{width:18px;height:18px}
.pagecount{font-family:var(--font-display);font-style:italic;font-size:13px;color:var(--ink-faint);min-width:110px;text-align:center}

.tapzone{position:fixed;top:70px;bottom:90px;width:64px;z-index:39;cursor:pointer;background:none;border:none}
.tapzone.left{left:0}
.tapzone.right{right:0}
@media (max-width:720px){.tapzone{width:34px}}

/* TOC drawer */
.toc-scrim{position:fixed;inset:0;background:rgba(7,11,26,.6);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.toc-scrim.open{opacity:1;pointer-events:auto}
.toc-drawer{
  position:fixed;top:0;right:0;bottom:0;width:340px;max-width:88vw;background:var(--panel);
  border-left:1px solid var(--line);z-index:51;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;padding:26px 0;
}
.toc-drawer.open{transform:translateX(0)}
.toc-head{padding:0 24px 18px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:baseline}
.toc-head h3{font-size:20px}
.toc-close{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:22px;line-height:1;padding:4px}
.toc-list{overflow-y:auto;flex:1;padding:14px 10px}
.toc-part{font-family:var(--font-display);font-style:italic;font-size:12.5px;color:var(--gold-soft);padding:16px 14px 6px}
.toc-item{
  display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:none;color:var(--ink-dim);
  padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-family:var(--font-body);
}
.toc-item:hover{background:var(--panel-2);color:var(--ink)}
.toc-item.current{color:var(--gold-soft);background:var(--panel-2)}
.toc-item b{font-family:var(--font-display);font-style:italic;color:var(--ink-faint);font-weight:400;flex:0 0 auto;width:26px}

/* ============================= COVER ============================= */
.cover{align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:
    radial-gradient(1100px 620px at 50% 8%,rgba(91,33,182,.28),transparent 60%),
    radial-gradient(760px 520px at 85% 92%,rgba(0,101,210,.22),transparent 60%),
    radial-gradient(640px 420px at 10% 90%,rgba(212,175,55,.14),transparent 60%),
    var(--obsidian);
}
.cover .emblem{width:min(50vw,300px);height:min(50vw,300px);margin-bottom:38px}
.cover .emblem .mono{font-size:min(18vw,110px)}
.cover h1{font-size:clamp(38px,8vw,84px);letter-spacing:-.01em;line-height:1;color:var(--snow)}
.cover h1 .grad{color:var(--gold-soft)}
.cover .kicker-word{font-family:var(--font-display);font-style:italic;font-size:16px;color:var(--ink-faint);letter-spacing:.02em;margin-top:10px}
.cover .tagline{font-size:17px;color:var(--ink-dim);max-width:520px;margin:22px auto 0}
.cover .open-cta{
  margin-top:44px;display:inline-flex;align-items:center;gap:12px;background:none;border:1px solid rgba(212,175,55,.5);
  color:var(--gold-soft);padding:14px 30px;border-radius:100px;font-family:var(--font-display);font-style:italic;
  font-size:16px;cursor:pointer;transition:background .25s,color .25s;
}
.cover .open-cta:hover{background:var(--gold);color:var(--ink-on-gold);border-color:var(--gold)}
.cover .open-cta svg{width:16px;height:16px}
.cover .credit{position:absolute;bottom:104px;left:0;right:0;font-size:11.5px;color:var(--ink-faint)}

/* ============================= BACK COVER ============================= */
.backcover{align-items:center;justify-content:center;text-align:center;background:var(--obsidian)}
.backcover .emblem{width:120px;height:120px;margin-bottom:28px}
.backcover .emblem .mono{font-size:44px}
.backcover h2{font-size:28px}
.backcover p{color:var(--ink-faint);font-size:13.5px;max-width:420px;margin:14px auto}
.backcover .contacts{display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.backcover .contacts a{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:100px;padding:9px 18px;
  color:var(--ink-dim);text-decoration:none;font-size:13px;
}
.backcover .contacts a:hover{border-color:var(--gold-soft);color:var(--gold-soft)}

/* ============================= COMPONENTS reused across appendix pages ============================= */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-display);font-style:italic;font-size:12px;font-weight:500;padding:2px 10px 2px 2px;border-radius:100px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;margin-left:8px}
.badge.CONFIRMED{color:var(--st-confirmed)}
.badge.HYPOTHESIS{color:var(--st-hypothesis)}
.badge.RECOMMENDATION{color:var(--st-recommendation)}
.badge.TO_VALIDATE{color:var(--st-validate)}
.badge.OPEN_QUESTION{color:var(--st-open)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-faint);margin:18px 0}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.card h3,.card h4{font-size:16px;margin-bottom:8px;font-weight:600}
.card p{font-size:13.8px;color:var(--ink-dim)}
.grid{display:grid;gap:14px;min-width:0}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid>*{min-width:0}
@media (max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr}}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
th,td{text-align:left;padding:11px 15px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-family:var(--font-display);font-style:italic;font-size:13px;color:var(--gold-soft);background:var(--panel-2);position:sticky;top:0;font-weight:500}
tr:last-child td{border-bottom:none}
td{color:var(--ink-dim)}
td b{color:var(--ink)}

details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.acc summary{cursor:pointer;list-style:none;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--font-display);font-style:italic;font-size:15px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:18px;color:var(--gold-soft);flex:0 0 auto;font-family:var(--font-body)}
details.acc[open] summary::after{content:"–"}
details.acc .body{padding:0 20px 18px;font-size:13.8px;color:var(--ink-dim)}
details.acc .body dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:7px 14px;margin:10px 0 0}
details.acc .body dt{color:var(--ink-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-body);font-weight:600}
details.acc .body dd{margin:0}

.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);border-radius:100px;padding:6px 14px;font-size:12.5px;cursor:pointer}
.chip.active{background:var(--gold);color:var(--ink-on-gold);border-color:var(--gold)}
.tabbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line-soft)}
.tabbtn{background:none;border:none;color:var(--ink-faint);padding:10px 14px;font-family:var(--font-display);font-style:italic;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbtn.active{color:var(--gold-soft);border-bottom-color:var(--gold)}
.tabpanel{display:none}
.tabpanel.active{display:block}

.callout{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:16px 20px 16px 46px;font-size:13.8px;color:var(--ink-dim);margin:16px 0;position:relative}
.callout::before{content:"i";position:absolute;left:16px;top:16px;width:19px;height:19px;border-radius:50%;border:1px solid var(--iris-soft);color:var(--iris-soft);font-family:var(--font-display);font-style:italic;font-size:12px;display:flex;align-items:center;justify-content:center}
.callout b{color:var(--ink)}
.note-anti{border:1px dashed rgba(251,113,133,.5);background:rgba(251,113,133,.06);border-radius:12px;padding:12px 16px;font-size:12.5px;color:var(--ink-dim);margin-top:14px}
.footnote{font-size:12.5px;color:var(--ink-faint);margin-top:10px}

.flowrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0}
.flownode{font-family:var(--font-display);font-style:italic;font-size:14px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:10px}
.flowarrow{color:var(--gold-soft);opacity:.8}

.journey-scroll{overflow-x:auto;padding-bottom:10px;margin:0 -4px}
.journey-track{display:flex;gap:0;min-width:1200px;padding:4px}
.journey-node{flex:1;min-width:100px;position:relative;padding:0 10px 0 0}
.journey-node .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);position:relative;z-index:2}
.journey-node .bar{position:absolute;top:6px;left:12px;right:-10px;height:2px;background:linear-gradient(90deg,var(--gold),var(--line))}
.journey-node:last-child .bar{display:none}
.journey-node .label{font-family:var(--font-display);font-style:italic;font-size:12.5px;margin-top:10px;color:var(--ink)}
.journey-node .msg{font-size:11.5px;color:var(--ink-faint);margin-top:4px;line-height:1.4}
.journey-node button{background:none;border:none;color:inherit;cursor:pointer;text-align:left;padding:0;font-family:inherit}

.heatmap{overflow-x:auto}
.heatmap table{min-width:520px}
.heatmap td.cell{text-align:center;width:32px}
.heatmap .fill{width:13px;height:13px;border-radius:4px;background:var(--gold);display:inline-block}
.heatmap .empty{width:13px;height:13px;border-radius:4px;background:var(--line-soft);display:inline-block}

.barchart .row{display:grid;grid-template-columns:180px minmax(0,1fr) 36px;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.barchart .row .lbl{color:var(--ink-dim)}
.barchart .row .track{height:8px;background:var(--panel-2);border-radius:6px;overflow:hidden;border:1px solid var(--line-soft)}
.barchart .row .fillbar{height:100%;background:linear-gradient(90deg,var(--iris-soft),var(--gold))}
.barchart .row .num{font-family:var(--font-display);font-style:italic;color:var(--gold-soft);text-align:right}

.bandbar-wrap{overflow-x:auto;margin:16px 0 8px}
.bandbar{display:flex;height:32px;border-radius:8px;overflow:hidden;border:1px solid var(--line);min-width:480px}
.bandbar .seg{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-size:12px;color:var(--ink-on-gold)}
.bandlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-faint)}
.bandlegend .k{display:inline-flex;align-items:center;gap:6px}
.bandlegend .sw{width:10px;height:10px;border-radius:3px}

.quadrant{position:relative;aspect-ratio:1/0.62;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;margin:18px 0}
.quadrant-inner{position:absolute;inset:30px}
.quadrant .axis{position:absolute;background:var(--line)}
.quadrant .axis.x{left:0;right:0;top:50%;height:1px}
.quadrant .axis.y{top:0;bottom:0;left:50%;width:1px}
.quadrant .axlabel{position:absolute;font-size:11px;color:var(--ink-faint);font-family:var(--font-display);font-style:italic}
.quadrant .pt{position:absolute;transform:translate(-50%,-50%);text-align:center}
.quadrant .pt .dot{width:15px;height:15px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);margin:0 auto}
.quadrant .pt.anti .dot{background:var(--st-open)}
.quadrant .pt .lbl{font-size:11px;font-family:var(--font-display);font-style:italic;margin-top:4px;white-space:nowrap}

.copyblock{position:relative}
.copybtn{position:absolute;top:12px;right:12px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-faint);border-radius:7px;padding:6px 11px;font-size:11px;cursor:pointer}
.copybtn:hover{color:var(--gold-soft)}
.copybtn.copied{color:var(--st-confirmed);border-color:var(--st-confirmed)}

.recognize{border-left:none;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.recognize .role{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--gold-soft);margin-bottom:6px}

/* print / continuous fallback niceties */
@media print{
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel-2:#f4f2f8; --card:#ffffff;
    --line:#cfcfd6; --line-soft:#e3e3e8;
    --ink:#111111; --ink-dim:#333333; --ink-faint:#55555c; --ink-on-gold:#ffffff;
    --gold-soft:#8a6a22; --gold-deep:#6b5219; --iris-soft:#5b21b6;
    --st-confirmed:#0a7a4d; --st-hypothesis:#4338ca; --st-recommendation:#8a6a22;
    --st-validate:#a15c07; --st-open:#be123c;
  }

/* ============================================================================ PAGINATION ENGINE ============================================================================ */
const stage = document.getElementById('stage');
let current = 0;

PAGES.forEach((p,i)=>{
  const article = el('article', p.kind==='cover'?'page cover':(p.kind==='backcover'?'page backcover':'page'));
  article.id = 'page-'+p.id;
  article.setAttribute('data-index', i);
  if(p.kind!=='cover' && p.kind!=='backcover'){
    article.innerHTML = '<div class="page-inner"></div>';
  }
  stage.appendChild(article);
  const target = (p.kind==='cover'||p.kind==='backcover') ? article : article.querySelector('.page-inner');
  p.build(target);
});

const pageEls = Array.from(stage.querySelectorAll('.page'));

function renderState(prevIndex, dir){
  pageEls.forEach((pe,i)=>{
    pe.classList.remove('active','dir-next','dir-prev');
    if(i===current){ pe.classList.add('active'); pe.removeAttribute('inert'); }
    else {
      pe.setAttribute('inert','');
      if(dir==='next' && i===prevIndex) pe.classList.add('dir-prev');
      else if(dir==='prev' && i===prevIndex) pe.classList.add('dir-next');
    }
  });
  document.getElementById('pagecount').textContent = (current+1)+' / '+pageEls.length;
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===pageEls.length-1;
  const active = pageEls[current];
  const inner = active.querySelector('.page-inner');
  if(inner) inner.scrollTop = 0;
  updateTocActive();
  try{ history.replaceState(null,'','#'+PAGES[current].id); }catch(e){}
}

function goTo(index){
  index = Math.max(0, Math.min(pageEls.length-1, index));
  if(index===current) return;
  const dir = index>current ? 'next' : 'prev';
  const prevIndex = current;
  current = index;
  renderState(prevIndex, dir);
}
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

document.getElementById('btn-next').addEventListener('click', next);
document.getElementById('btn-prev').addEventListener('click', prev);
document.getElementById('tap-next').addEventListener('click', next);
document.getElementById('tap-prev').addEventListener('click', prev);
document.getElementById('btn-home').addEventListener('click', ()=>goTo(0));
document.addEventListener('keydown', e=>{
  if(document.body.classList.contains('continuous')) return;
  if(e.key==='ArrowRight') next();
  else if(e.key==='ArrowLeft') prev();
  else if(e.key==='Escape') closeToc();
});

/* swipe (mobile) */
(function(){
  let x0=null;
  stage.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 60){ dx<0 ? next() : prev(); }
    x0=null;
  }, {passive:true});
})();

/* cover CTA */
stage.addEventListener('click', e=>{
  if(e.target.closest('#cta-open')) next();
});

/* ---------------- TOC ---------------- */
const tocList = document.getElementById('toc-list');
const partLabels = { historia:'Parte I — A História', apendice:'Parte II — O Apêndice' };
let lastPart = undefined;
PAGES.forEach((p,i)=>{
  if(p.part && p.part!==lastPart){
    tocList.appendChild(el('div','toc-part', partLabels[p.part]));
    lastPart = p.part;
  }
  if(p.kind==='cover' || p.kind==='backcover') return;
  const btn = el('button','toc-item', '<b>'+(p.label||'').replace('Capítulo ','C.').replace('Apêndice ','Ap.')+'</b>'+(p.title||''));
  btn.dataset.index = i;
  btn.addEventListener('click', ()=>{ goTo(i); closeToc(); });
  tocList.appendChild(btn);
});
function updateTocActive(){
  tocList.querySelectorAll('.toc-item').forEach(b=>b.classList.toggle('current', Number(b.dataset.index)===current));
}
const tocDrawer=document.getElementById('toc-drawer'), tocScrim=document.getElementById('toc-scrim');
function openToc(){ tocDrawer.classList.add('open'); tocScrim.classList.add('open'); }
function closeToc(){ tocDrawer.classList.remove('open'); tocScrim.classList.remove('open'); }
document.getElementById('btn-toc').addEventListener('click', openToc);
document.getElementById('toc-close').addEventListener('click', closeToc);
tocScrim.addEventListener('click', closeToc);

/* ---------------- continuous mode ---------------- */
const btnContinuous = document.getElementById('btn-continuous');
const continuousLabel = document.getElementById('continuous-label');
btnContinuous.addEventListener('click', ()=>{
  const on = document.body.classList.toggle('continuous');
  continuousLabel.textContent = on ? 'Ler como livro' : 'Ler como documento';
  pageEls.forEach(pe=>pe.removeAttribute('inert'));
});

/* ---------------- deep link ---------------- */
(function(){
  const hash = location.hash.replace('#','');
  const idx = PAGES.findIndex(p=>p.id===hash);
  if(idx>0){ current=idx; }
})();
renderState(0,'next');
})();
