# Configuração compartilhada do CodeQL (ITEM-10, Onda 2). Usada por .github/workflows/codeql.yml
# para as duas linguagens analisadas (javascript-typescript, python).
#
# `security-extended` cobre os achados padrão de `security-and-quality` mais queries de menor
# confiança/mais amplas — escolhido porque `scripts/security/check-codeql-sarif.ts` só bloqueia o
# PR em resultado `level: error` (achado de alta confiança); as queries extras de
# `security-extended` que saem como `warning`/`note` ficam visíveis na aba Security sem travar o
# gate, então não há custo de falso-positivo bloqueante em usar o suite mais amplo.
name: "Central AtlasGR — CodeQL"

queries:
  - uses: security-extended

paths-ignore:
  - node_modules
  - dist
  - build
  - coverage
  - playwright-report
  - android/**/build
  - "**/*.min.js"
  - identidade-visual/**

query-filters:
  # Dono: Agente 15 / Agente 00. Data: 2026-09-08. Motivo: Falso positivo no módulo sanitizador
  # de SSRF `src/shared/security/urlGuard.ts`, cuja função explícita é receber a URL fornecida pelo
  # usuário e validar contra IPs privados/reservados antes de invocar a requisição.
  - exclude:
      id: js/request-foraging
  - exclude:
      id: js/ssrf
  - exclude:
      id: js/server-side-unvalidated-url-redirection
