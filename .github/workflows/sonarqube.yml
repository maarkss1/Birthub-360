name: SonarQube Analysis

# Redundância conhecida (auditoria de CI, onda 3): este job roda `test:unit --coverage` de novo,
# mesmo ci.yml já gerando e publicando esse mesmo relatório como artifact `coverage-reports` (ver
# ci.yml, step "Upload coverage reports", `if: always()`). Reaproveitar aquele artifact aqui
# exigiria trocar o gatilho deste workflow para `workflow_run` (esperar ci.yml terminar, baixar o
# artifact via `actions/download-artifact` com `run-id: ${{ github.event.workflow_run.id }}`) e
# resolver o contexto de PR a partir de `github.event.workflow_run.pull_requests` em vez de
# `pull_request` nativo — uma mudança de comportamento maior (Sonar passaria a rodar só depois do
# ci.yml concluir, e a decoração de PR dependeria desse mapeamento) que não foi feita nesta rodada
# por não ser possível validar contra o GitHub Actions real nesta sessão.
#
# O gap de coverage documentado aqui anteriormente (`sonar.javascript.lcov.reportPaths` não batia
# com o `reportsDirectory`/`reporter` de `vitest.unit.config.ts`) foi corrigido nesta onda:
# `vitest.unit.config.ts` agora inclui `lcov` em `coverage.reporter`, e
# `sonar-project.properties` aponta para `coverage/unit/lcov.info` (o `reportsDirectory` real
# deste config, não o `./coverage` do `vitest.config.ts` da raiz usado só pelo Storybook).
# Validado localmente rodando um subconjunto de testes com `--coverage` e confirmando o arquivo.
# O que É feito nesta rodada: este job já roda só a fatia mínima que o Sonar precisa (unit +
# coverage), não a suíte completa de ci.yml (sem integration/e2e/build) — não há aqui outra
# duplicação óbvia a remover sem a mudança de trigger acima.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      # if: não pode ler o contexto "secrets" diretamente (só env/vars/job/etc — ver
      # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability).
      # Copiamos pra env no nível do job pra poder condicionar o step de scan abaixo.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Sem isso, src/config/env.ts (importado por src/lib/prisma.ts, que quase todo teste unitário
      # acaba puxando) falha a validação do zod por falta de NODE_ENV e chama process.exit(1) — o
      # que derruba o processo do Vitest inteiro antes de qualquer teste rodar. production.yaml já
      # seta isso pro job build-and-test; este workflow ficou de fora dessa correção.
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests with Coverage
        run: npm run test:unit -- --coverage

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@ad8210318ac8bb816e41990d5af2b304f7a6c213 # master (snapshot fixado em SHA — política de branch protection exige commit SHA completo, não branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
