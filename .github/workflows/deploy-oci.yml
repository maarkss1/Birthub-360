name: Deploy Oracle Cloud (produção)
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Debug
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          if [ -n "$OCI_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$OCI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/oci_deploy_key -o IdentitiesOnly=yes -p "$OCI_SSH_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$OCI_SSH_USER@$OCI_SSH_HOST" bash -s -- "$OCI_DEPLOY_PATH" <<'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"
          
          echo "=== FIXING ENV ==="
          if [ -f .env.production ]; then
            sed -i 's/http:\/\/localhost:3000//g' .env.production
            sed -i 's/http:\/\/127.0.0.1:3000//g' .env.production
            sed -i 's/ALLOWED_ORIGINS=.*$/ALLOWED_ORIGINS=http:\/\/163.176.150.154,https:\/\/163.176.150.154/' .env.production
            cat .env.production | grep ALLOWED_ORIGINS
          fi
          
          echo "=== RESTARTING DOCKER ==="
          # Need to source env for docker compose
          set -a; source .env.production; set +a
          docker compose -f docker-compose.oci.yml down || true
          docker compose -f docker-compose.oci.yml up -d
          
          echo "=== WAITING FOR CONTAINER TO START ==="
          sleep 10
          docker logs --tail 50 birthhub_app
          
          echo "=== RUNNING DB SCRIPT ==="
          docker exec -i birthhub_app node --import tsx -e "
          import { hashPassword } from 'better-auth/crypto';
          import pg from 'pg';
          import crypto from 'node:crypto';
          const targetEmail = 'marcelinmark@gmail.com';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          async function run() {
            const client = await pool.connect();
            try {
              await client.query('BEGIN');
              await client.query(\\\"SELECT set_config('app.bypass_rls', 'on', true)\\\");
              let orgRes = await client.query('SELECT id FROM \\\"Organization\\\" ORDER BY \\\"createdAt\\\" ASC LIMIT 1');
              let orgId = orgRes.rows[0]?.id;
              if (!orgId) {
                orgId = crypto.randomUUID();
                await client.query('INSERT INTO \\\"Organization\\\" (id, name, \\\"createdAt\\\", \\\"updatedAt\\\") VALUES (\\\, \\\'Birth Hub 360\\\', NOW(), NOW())', [orgId]);
              }
              const passwordHash = await hashPassword('00000000');
              let userRes = await client.query('SELECT id FROM \\\"user\\\" WHERE LOWER(email) = \\\', [targetEmail]);
              let targetUserId = userRes.rows[0]?.id;
              if (!targetUserId) {
                targetUserId = crypto.randomUUID();
                await client.query('INSERT INTO \\\"user\\\" (id, name, email, role, \\\"emailVerified\\\", \\\"mustChangePassword\\\", \\\"organizationId\\\", \\\"createdAt\\\", \\\"updatedAt\\\") VALUES (\\\, \\\'Marcelo Nascimento\\\', \\\, \\\'ADMIN\\\', TRUE, TRUE, \\\, NOW(), NOW())', [targetUserId, targetEmail, orgId]);
                await client.query('INSERT INTO \\\"account\\\" (id, \\\"accountId\\\", \\\"providerId\\\", \\\"userId\\\", password, \\\"createdAt\\\", \\\"updatedAt\\\") VALUES (\\\, \\\, \\\'credential\\\', \\\, \\\, NOW(), NOW())', [crypto.randomUUID(), targetUserId, targetUserId, passwordHash]);
              } else {
                await client.query('UPDATE \\\"user\\\" SET name = \\\'Marcelo Nascimento\\\', role = \\\'ADMIN\\\', \\\"mustChangePassword\\\" = TRUE, \\\"emailVerified\\\" = TRUE, \\\"updatedAt\\\" = NOW() WHERE id = \\\', [targetUserId]);
                const accRes = await client.query('SELECT id FROM \\\"account\\\" WHERE \\\"userId\\\" = \\\ AND \\\"providerId\\\" = \\\'credential\\\'', [targetUserId]);
                if (accRes.rows.length === 0) {
                  await client.query('INSERT INTO \\\"account\\\" (id, \\\"accountId\\\", \\\"providerId\\\", \\\"userId\\\", password, \\\"createdAt\\\", \\\"updatedAt\\\") VALUES (\\\, \\\, \\\'credential\\\', \\\, \\\, NOW(), NOW())', [crypto.randomUUID(), targetUserId, targetUserId, passwordHash]);
                } else {
                  await client.query('UPDATE \\\"account\\\" SET password = \\\, \\\"updatedAt\\\" = NOW() WHERE \\\"userId\\\" = \\\ AND \\\"providerId\\\" = \\\'credential\\\'', [passwordHash, targetUserId]);
                }
              }
              const otherUsers = await client.query('SELECT id, email FROM \\\"user\\\" WHERE id != \\\', [targetUserId]);
              for (const other of otherUsers.rows) {
                await client.query('DELETE FROM \\\"session\\\" WHERE \\\"userId\\\" = \\\', [other.id]);
                await client.query('DELETE FROM \\\"account\\\" WHERE \\\"userId\\\" = \\\', [other.id]);
                await client.query('DELETE FROM \\\"user\\\" WHERE id = \\\', [other.id]);
              }
              await client.query('DELETE FROM \\\"session\\\"');
              await client.query('COMMIT');
              console.log('SUCCESS: ' + targetEmail + ' is now the sole ADMIN with mustChangePassword=TRUE');
            } catch (err) {
              await client.query('ROLLBACK');
              console.error('Error:', err.message);
            } finally {
              client.release();
              await pool.end();
            }
          }
          run();
          " || true
          REMOTE_SCRIPT
