name: Deploy Oracle Cloud (produção)

# Achado real (usuário reportou tela do Hub não atualizada em produção após merge no main):
# diferente do Render (`autoDeployTrigger: commit`, ver render.yaml), o caminho Oracle Cloud
# (ADR-004, alvo definitivo de produção — ver docs/deploy/oracle-cloud.md) não tinha NENHUM
# mecanismo automático: `scripts/deploy-oci.sh` só existia para execução manual, via SSH, dentro
# da própria instância, e nem faz `git pull` sozinho. Merge no GitHub != deploy real.
#
# Mesmo padrão de gate já usado em docker-publish.yml: só dispara depois que o workflow canônico
# de release (ci.yml, "Central Birth Hub 360 Release") passar de verdade em main — nunca deploya com CI
# vermelho. workflow_dispatch continua disponível para redeploy manual, mas exige um SHA explícito
# e reprova o gate (job `resolve-sha`, action `.github/actions/require-ci-green`) exatamente como o
# disparo automático — nenhum caminho pula a validação (Onda 10.2, PROMPT 10.2: "NO CI PASS = NO
# DEPLOY", sem exceção para workflow_dispatch).
#
# Fechamento de um risco real encontrado na Onda 10.2: antes desta mudança, o passo de deploy fazia
# `git reset --hard origin/main` na instância — mesmo no disparo automático (workflow_run), que já
# carrega o SHA exato validado pelo CI (`github.event.workflow_run.head_sha`). Se um commit novo
# chegasse em `main` entre o CI terminar e este deploy rodar, a instância acabava recebendo HEAD
# atual (não validado), não o SHA que de fato passou no CI. Corrigido: a instância agora faz
# checkout do SHA explícito resolvido pelo job `resolve-sha`, nunca de `origin/main`.
#
# ATIVAÇÃO: este workflow FALHA DE PROPÓSITO (passo "Validar secrets obrigatórios") enquanto os
# secrets abaixo não existirem em Settings → Secrets and variables → Actions do repositório —
# mesmo padrão de "pronto mas com ativação pendente" já usado em backup-production.yml. Isso é
# esperado e seguro: não afeta a aplicação em produção, só sinaliza no Actions que a automação
# ainda não foi configurada. Depois de cadastrar os secrets, o próximo push em main (ou um
# workflow_dispatch manual) já deploya de verdade, sem precisar editar este arquivo.
#
# Secrets obrigatórios:
#   OCI_SSH_HOST         IP ou hostname público da instância (ex.: 163.176.150.147)
#   OCI_SSH_USER          usuário SSH (ex.: ubuntu, opc)
#   OCI_SSH_PRIVATE_KEY   chave privada SSH (PEM) com acesso à instância — recomenda-se uma chave
#                         DEDICADA a este workflow (não a chave pessoal do operador), com escopo
#                         mínimo necessário na instância.
#   OCI_DEPLOY_PATH       caminho absoluto do clone do repositório na instância (ex.:
#                         /home/ubuntu/CENTRAL-DE-INTELIG-NCIA-COMERCIAL-ATLASGR)
# Secret opcional:
#   OCI_SSH_KNOWN_HOSTS   saída de `ssh-keyscan -H <host>` capturada manualmente e colada aqui,
#                         para fixar a chave do host em vez de confiar em TOFU (trust-on-first-use)
#                         via `ssh-keyscan` rodado pelo próprio workflow a cada execução. Mais
#                         seguro contra MITM na primeira conexão; omitir usa TOFU normalmente.

on:
  workflow_run:
    workflows: ['Central Birth Hub 360 Release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit SHA completo (40 chars) já aprovado pelo CI a implantar. Obrigatório — nunca
          deixe em branco para "usar HEAD de main"; resolva o SHA explicitamente antes de disparar.
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-oci-production
  cancel-in-progress: false

jobs:
  resolve-sha:
    name: Resolver SHA e validar CI (NO CI PASS = NO DEPLOY)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout (só para a composite action local)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolver SHA alvo
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Exigir CI verde para o SHA (bloqueia se não houver)
        uses: ./.github/actions/require-ci-green
        with:
          sha: ${{ steps.resolve.outputs.sha }}
          check-name: build

  deploy:
    name: Deploy via SSH (docker compose up -d --build)
    environment: production
    needs: resolve-sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ needs.resolve-sha.outputs.sha }}
    steps:
      - name: Validar secrets obrigatórios
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=0
          for name in OCI_SSH_HOST OCI_SSH_USER OCI_SSH_PRIVATE_KEY OCI_DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret obrigatório ausente: $name — cadastre em Settings > Secrets and variables > Actions antes de esperar deploy automático. Ver comentário no topo de .github/workflows/deploy-oci.yml."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Configurar chave SSH
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          if [ -n "$OCI_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$OCI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: git fetch + checkout do SHA validado + docker compose up -d --build na instância
        id: remote_deploy
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
          OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci_deploy_key -o IdentitiesOnly=yes -p "$OCI_SSH_PORT" \
            "$OCI_SSH_USER@$OCI_SSH_HOST" bash -s -- "$OCI_DEPLOY_PATH" "$TARGET_SHA" <<'REMOTE_SCRIPT' | tee /tmp/remote-deploy.log
          set -euo pipefail
          DEPLOY_PATH="$1"
          TARGET_SHA="$2"
          cd "$DEPLOY_PATH"
          echo "== PREVIOUS_SHA (antes deste deploy) =="
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          echo "PREVIOUS_SHA=${PREVIOUS_SHA}"
          echo "== git fetch + checkout do SHA validado (nunca origin/main HEAD) =="
          git fetch origin "$TARGET_SHA"
          # Confirma que o objeto existe antes de tentar o checkout — mensagem de erro clara em vez
          # de um `checkout` falhando de forma ambígua se o SHA informado nunca chegou ao remote.
          git cat-file -e "${TARGET_SHA}^{commit}" || {
            echo "::error::SHA ${TARGET_SHA} não encontrado no remote após fetch — DEPLOY BLOCKED."
            exit 1
          }
          git checkout --detach "$TARGET_SHA"
          echo "CURRENT_SHA=${TARGET_SHA}"
          echo "== rodando scripts/deploy-oci.sh (rebuild + restart + migrations + seed) =="
          chmod +x scripts/deploy-oci.sh
          ./scripts/deploy-oci.sh
          echo "== health checks pós-deploy =="
          curl -fsS http://127.0.0.1:3000/health/live
          curl -fsS http://127.0.0.1:3000/health/ready
          echo "SMOKE_TEST=PASS"
          REMOTE_SCRIPT

      - name: Extrair PREVIOUS_SHA do log remoto
        if: always()
        id: previous_sha
        run: |
          prev="$(grep -oE '^PREVIOUS_SHA=[0-9a-f]{40}$' /tmp/remote-deploy.log | tail -n1 | cut -d= -f2 || true)"
          smoke="$(grep -oE '^SMOKE_TEST=.*$' /tmp/remote-deploy.log | tail -n1 | cut -d= -f2 || echo 'FAIL')"
          echo "sha=${prev}" >> "$GITHUB_OUTPUT"
          echo "smoke=${smoke}" >> "$GITHUB_OUTPUT"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deployment — Birth Hub 360º"
            echo '```'
            echo "ENVIRONMENT............. PRODUCTION (Oracle Cloud)"
            echo "COMMIT SHA............... ${TARGET_SHA}"
            echo "PREVIOUS SHA.............. ${{ steps.previous_sha.outputs.sha || 'desconhecido (ver log remoto)' }}"
            echo "CI QUALITY GATE........... PASS (validado antes do deploy, ver job resolve-sha)"
            echo "TRIGGER................... ${{ github.event_name }}"
            echo "ACTOR...................... ${{ github.actor }}"
            echo "TIMESTAMP.................. $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "MIGRATIONS................. incluído em scripts/deploy-oci.sh (npx prisma migrate deploy)"
            echo "SMOKE TEST.................. ${{ steps.previous_sha.outputs.smoke || 'FAIL' }}"
            echo "DEPLOYMENT.................. ${{ job.status }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
