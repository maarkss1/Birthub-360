sonar.projectKey=prospector-atlas
sonar.projectName=Prospector Atlas API
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Coverage
# Precisa bater com `coverage.reportsDirectory` de vitest.unit.config.ts (o config que
# .github/workflows/sonarqube.yml realmente roda via `npm run test:unit -- --coverage`), não com
# o vitest.config.ts da raiz (usado só pelos testes do Storybook, reportsDirectory diferente).
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
